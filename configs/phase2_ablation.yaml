# Phase-2 ablation grid (same budgets as phase2_dev).
development_only: true
holdout_sealed: true
inherits: configs/phase2_dev.yaml
ablations:
  - name: STaR_v1
    use_certified_reject: true
    use_criticality: true
    use_progressive: true
    allow_partial_charge: true
    allow_multi_edit: true
  - name: STaR_no_reject
    use_certified_reject: false
  - name: STaR_no_criticality
    use_criticality: false
  - name: STaR_no_progressive
    use_progressive: false
  - name: STaR_no_partial
    allow_partial_charge: false
  - name: STaR_single_edit
    allow_multi_edit: false
outputs:
  root: results/phase2
  raw: results/phase2/raw/ablation