# Tiny Phase-2 smoke configuration (development routes only).
development_only: true
holdout_sealed: true
battery_capacity: 700
energy_consumption_rate: 1.0
target_route_reliability: 0.95
simulation:
  scenario_seed: 20261122
  master_seed: 20261122
  split_opt: opt
  split_val: val
  N_val: 128
budget:
  wall_seconds: 10.0
  max_candidate_evals: 20
  max_scenario_evals: 2000
  progressive_stages: [32, 64]
  validation_scenarios: 64
star:
  use_certified_reject: true
  use_criticality: true
  use_progressive: true
  allow_partial_charge: true
  allow_multi_edit: true
  nearby_stations: 3
methods: [B0, B1, B2, B3, STaR_v1]
smoke:
  max_routes: 2
outputs:
  root: results/phase2
  smoke: results/phase2/raw/smoke