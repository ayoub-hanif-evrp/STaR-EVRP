[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-evrp"
version = "0.1.0"
description = "STaR-EVRP: Slack-Targeted Stochastic Charging Repair for EVRPTW"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "STaR-EVRP Research Team" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]