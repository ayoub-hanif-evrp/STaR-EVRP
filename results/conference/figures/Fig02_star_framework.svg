   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="21.236213" y="48.634165" transform="rotate(-0 21.236213 48.634165)">Start from CON</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 63.968632)">Feasible ordered plan</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 73.653632)">Station laws, target, caps</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 84.060351)">Trace + score on 512 draws</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="139.882099" y="48.634165" transform="rotate(-0 139.882099 48.634165)">Rank visits and gaps</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 63.968632)">Lowest upper bound first</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 73.653632)">Prioritize gaps near the</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 84.060351)">most critical station</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="258.527985" y="48.634165" transform="rotate(-0 258.527985 48.634165)">Interleave moves</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 63.968632)">Adjust or transfer charge</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 73.653632)">Remove, replace, relocate</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 83.680284)">or insert, then allocate</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="377.173871" y="48.634165" transform="rotate(-0 377.173871 48.634165)">Check candidate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 63.968632)">Skip duplicate plans</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 73.653632)">Require energy feasibility</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 83.338632)">and zero-wait timing</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="377.173871" y="146.392636" transform="rotate(-0 377.173871 146.392636)">Analytical screen</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 162.448821)">If incumbent attains:</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 171.412102)">reject when marginal bound</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(377.173871 181.097102)">falls below target¹</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="258.527985" y="146.392636" transform="rotate(-0 258.527985 146.392636)">Prefix evaluation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 161.727102)">Score a 128-draw prefix</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 171.412102)">Prune if it cannot improve</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(258.527985 181.818821)">Otherwise extend to 512</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="139.882099" y="146.392636" transform="rotate(-0 139.882099 146.392636)">Compare full scores</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 161.727102)">Favor target attainment</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 171.753755)">Attain: min return, max R</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(139.882099 181.438755)">Below: max R, min return</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="21.236213" y="146.392636" transform="rotate(-0 21.236213 146.392636)">Return incumbent</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 161.727102)">When proposals end with</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 171.412102)">no improvement, or a</text>
    <text style="font-size: 7.45px; font-family: 'DejaVu Sans'; fill: #1e293b" transform="translate(21.236213 181.097102)">cooperative guard stops</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="432.894206" y="112.115062" transform="rotate(-0 432.894206 112.115062)">Feasible</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="167.261919" y="111.35687" transform="rotate(-0 167.261919 111.35687)">Strict gain: update and restart</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="189.838261" y="219.481202" transform="rotate(-0 189.838261 219.481202)">Rejected or no strict gain: try the next proposal while guards permit.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="18.354127" y="243.951923" transform="rotate(-0 18.354127 243.951923)">¹ True-reliability bound. Bypass if the incumbent misses the empirical target.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e293b" x="18.354127" y="262.045341" transform="rotate(-0 18.354127 262.045341)">Shared ordinal optimization tape. Independent 10,000-draw validation follows search.</text>
   </g>
